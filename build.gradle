plugins {
    id 'groovy'
    id 'jacoco'
    id 'codenarc'
}

repositories {
    maven { url 'https://repo.jenkins-ci.org/releases/' }
    mavenCentral()
}

sourceSets {
    main {
        groovy { srcDirs = ['src', 'vars'] }
        resources { srcDirs = ['resources'] }
    }

    test {
        groovy { srcDirs = ['tests'] }
    }
}

dependencies {
    implementation(group: 'org.apache.groovy', name: 'groovy-all', version: '4.0.22')
    testImplementation "com.lesfurets:jenkins-pipeline-unit:1.9"
    // testImplementation(group: 'com.lesfurets', name: 'jenkins-pipeline-unit', version: '1.9')
    // testImplementation(group: 'junit', name: 'junit', version: '4.12')
    testImplementation(group: 'org.junit.jupiter', name: 'junit-jupiter', version: '5.8.0')
    testImplementation(group: 'org.assertj', name: 'assertj-core', version: '3.13.2')
}

tasks.named('test') {
    useJUnitPlatform() 
    testLogging {
        events("passed", "skipped", "failed")
        // showStackTraces = true
        showStandardStreams = true
        // exceptionFormat = org.gradle.api.tasks.testing.logging.TestExceptionFormat.FULL
    }
}
